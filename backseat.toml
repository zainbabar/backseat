model = "gpt-5.4-mini"
# Override stages independently; model remains the fallback for older configs.
observer_model = "gpt-5.4-mini"
writer_model = "gpt-5.4-mini"
speech_model = "eleven_v4"
# Quiet companion timing. For quick testing, pass --interval 10 instead of editing.
sample_seconds = 30
cooldown_seconds = 60
# Fraction of thumbnail pixels with a luminance difference greater than 20.
change_threshold = 0.02
# Preserve readable text; smaller regions work better than an entire ultrawide.
image_max_edge = 2560
api_timeout_seconds = 20
stale_seconds = 60
