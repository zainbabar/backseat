[project]
name = "backseat"
version = "0.1.0"
description = "A sarcastic AI friend that watches a screen region you choose and comments out loud."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zain Babar" }]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "openai>=1.100,<3",
  "elevenlabs>=2,<3",
  "mss>=10,<12",
  "Pillow>=11,<13",
  "PySide6>=6.8,<7",
  "python-dotenv>=1,<2",
  "pydantic>=2,<3",
]

[project.scripts]
backseat = "backseat.cli:main"

[project.urls]
Repository = "https://github.com/zainbabar/backseat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
